[package]
name = "puppet-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spade = "2.15"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
nalgebra-sparse = "0.11"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
